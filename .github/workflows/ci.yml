name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm ci

      - name: Run linting
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run lint

      - name: Run type checking
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run typecheck

      - name: Run tests
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run test
        timeout-minutes: 10

      - name: Build project
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run build

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Test on multiple Node versions
  test-matrix:
    name: Test Matrix (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm ci

      - name: Run tests
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run test
        timeout-minutes: 10

  # Test on Windows
  test-windows:
    name: Test Windows
    runs-on: windows-latest
    needs: ci
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm ci

      - name: Run tests
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run test
        timeout-minutes: 15

  # Test on macOS
  test-macos:
    name: Test macOS
    runs-on: macos-latest
    needs: ci
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm ci

      - name: Run tests
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run test
        timeout-minutes: 15

  # Publish to npm on release
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ci, test-matrix, test-windows, test-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm ci

      - name: Build
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm run build

      - name: Publish to npm
        working-directory: ${{ github.workspace }}/opencode-subagents
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}